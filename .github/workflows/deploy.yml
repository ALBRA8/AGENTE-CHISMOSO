# =============================================================================
# CHISMOSO V1.5 — CD pipeline
# Task IMP-PROD-OPS, audit PROD-AUDIT-OPS P0-4.
#
# Triggered after `ci.yml` passes on `main`. Builds the production Docker
# image, pushes it to GHCR, then deploys to staging automatically and to prod
# on manual approval.
#
# Required GitHub Secrets (Settings → Secrets and variables → Actions):
#   GHCR_TOKEN              — PAT with `write:packages` scope (for push to GHCR)
#   DEPLOY_SSH_KEY_STAGING  — private SSH key for staging user
#   DEPLOY_SSH_KEY_PROD     — private SSH key for prod user
#   DEPLOY_HOST_STAGING     — staging server IP/hostname
#   DEPLOY_HOST_PROD        — prod server IP/hostname
#   DEPLOY_USER_STAGING     — SSH user (staging)
#   DEPLOY_USER_PROD        — SSH user (prod)
#
# Image tagging: `<repo-sha>` (immutable per commit) + `latest` (mutable).
# Rollback = change the tag on the server (see docs/UPGRADE.md).
# =============================================================================
name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref (sha or branch) to deploy"
        required: false
        default: "main"
      environment:
        description: "Target environment"
        required: true
        type: choice
        default: staging
        options: [staging, production]

# Only deploy if CI passed. Avoids the situation where CI red but CD still
# ships a broken image.
jobs:
  build-image:
    name: Build + push image
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Set up QEMU (for cross-arch builds if needed)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Compute image tag (commit SHA, short)
        id: meta
        run: |
          SHA=$(git rev-parse --short HEAD)
          echo "sha=${SHA}" >> $GITHUB_OUTPUT
          echo "Building ghcr.io/albra8/agente-chismoso:${SHA}"

      - name: Build + push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/albra8/agente-chismoso:${{ steps.meta.outputs.sha }}
            ghcr.io/albra8/agente-chismoso:latest
          # Cache via GHCR's inline cache + gha backend for fast rebuilds.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Build-time args (none right now — kept here for future use).
          provenance: false

      - name: Print image size
        run: |
          docker image inspect ghcr.io/albra8/agente-chismoso:${{ steps.meta.outputs.sha }} \
            --format 'Image size: {{ .Size }} bytes' \
            | awk '{printf "%s (%.1f MB)\n", $0, $3/1024/1024}'

  deploy-staging:
    name: Deploy → staging
    needs: build-image
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_run' || (github.event_name == 'workflow_dispatch' && inputs.environment == 'staging') }}
    environment:
      name: staging
      url: https://staging.chismoso.example.com
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY_STAGING }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST_STAGING }} >> ~/.ssh/known_hosts

      - name: Pull + restart on staging
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.DEPLOY_USER_STAGING }}@${{ secrets.DEPLOY_HOST_STAGING }} <<'REMOTE'
            set -euo pipefail
            cd /opt/chismoso
            # Pull the new image
            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull app chismoso-scheduler chismoso-backup
            # Tag the pulled image so docker-compose.yml `image: chismoso:local` resolves it
            docker tag ghcr.io/albra8/agente-chismoso:${{ needs.build-image.outputs.image_tag }} chismoso:local
            # Recreate containers that have a new image
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --no-deps app chismoso-scheduler chismoso-backup
            # Run chismoso schema migrations (idempotent — SQLite-only,
            # no Prisma/Postgres step anymore since P0-15 closed in R2-IMP-OPS).
            docker compose exec -T app node chismoso/dist/cli.js doctor --fix
          REMOTE

      - name: Smoke test staging
        run: |
          # Wait for Next.js to come up (max 60s)
          for i in {1..30}; do
            if curl -fsS https://staging.chismoso.example.com/api/livez; then
              echo "✓ staging /api/livez OK"
              exit 0
            fi
            sleep 2
          done
          echo "✗ staging /api/livez never came up"
          docker --context ssh://${{ secrets.DEPLOY_USER_STAGING }}@${{ secrets.DEPLOY_HOST_STAGING }} compose -f /opt/chismoso/docker-compose.yml logs --tail=200 app
          exit 1

  deploy-prod:
    name: Deploy → production (manual approval)
    needs: [build-image, deploy-staging]
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.environment == 'production' }}
    # `environment: production` triggers GitHub's required reviewers gate —
    # the deploy only proceeds after a maintainer approves in the Actions UI.
    environment:
      name: production
      url: https://chismoso.example.com
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY_PROD }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST_PROD }} >> ~/.ssh/known_hosts

      - name: Pre-deploy backup
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.DEPLOY_USER_PROD }}@${{ secrets.DEPLOY_HOST_PROD }} \
            "docker compose -f /opt/chismoso/docker-compose.yml exec -T app /opt/scripts/backup-sqlite.sh"
          echo "✓ pre-deploy backup complete"

      - name: Pull + restart on prod
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.DEPLOY_USER_PROD }}@${{ secrets.DEPLOY_HOST_PROD }} <<'REMOTE'
            set -euo pipefail
            cd /opt/chismoso
            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull app chismoso-scheduler chismoso-backup
            docker tag ghcr.io/albra8/agente-chismoso:${{ needs.build-image.outputs.image_tag }} chismoso:local
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --no-deps app chismoso-scheduler chismoso-backup
            # Run chismoso schema migrations (idempotent — SQLite-only,
            # no Prisma/Postgres step anymore since P0-15 closed in R2-IMP-OPS).
            docker compose exec -T app node chismoso/dist/cli.js doctor --fix
          REMOTE

      - name: Smoke test prod
        run: |
          for i in {1..30}; do
            if curl -fsS https://chismoso.example.com/api/livez; then
              echo "✓ prod /api/livez OK"
              exit 0
            fi
            sleep 2
          done
          echo "✗ prod /api/livez never came up — ROLLBACK NOW (see docs/UPGRADE.md)"
          exit 1

      - name: Notify on success
        if: success()
        run: |
          echo "::notice::Production deploy complete: ${{ needs.build-image.outputs.image_tag }}"
