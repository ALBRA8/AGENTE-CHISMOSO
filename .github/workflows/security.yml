# =============================================================================
# CHISMOSO V1.5 — Security pipeline
# Task IMP-PROD-OPS, audit PROD-AUDIT-OPS P0-4.
#
# Triggered:
#   - Weekly (Sunday 02:00 UTC) — full deep scan
#   - On push to main — quick scan (deps audit only)
#
# Jobs:
#   deps-audit    — npm audit (production deps, high+ severity)
#   sast          — Semgrep with auto-config (covers OWASP + bandit + eslint)
#   secrets-scan  — gitleaks on full repo history (catches old leaked secrets)
#
# A failure here opens a security issue with the `security` label so it can
# be tracked + remediated under the disclosure timeline in SECURITY.md.
# =============================================================================
name: Security

on:
  push:
    branches: [main]
  schedule:
    # Sunday 02:00 UTC = Friday 21:00 Bogotá time. Runs over weekend so the
    # report is ready for Monday morning triage.
    - cron: "0 2 * * 0"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  deps-audit:
    name: Dependency audit (production, high+)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3
      - name: Install root deps (no devDeps for audit purity)
        run: bun install --frozen-lockfile --production
      - name: npm audit root (high+, fail on critical)
        run: |
          # Fail only on CRITICAL. HIGH is reported as a warning so it
          # doesn't block the pipeline while we work through the backlog.
          bunx npm audit --audit-level=critical --omit=dev
      - name: Install chismoso deps
        run: |
          cd chismoso
          bun install --frozen-lockfile --production
      - name: npm audit chismoso (critical+)
        run: |
          cd chismoso
          bunx npm audit --audit-level=critical --omit=dev

  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Semgrep scan
        uses: returntocorp/semgrep-action@v1
        with:
          # `auto` includes p/owasp-top-ten, p/typescript, p/react, p/nodejs,
          # p/security-audit, p/ci, p/eslint, and the community rules.
          config: auto
          # Generate SARIF for upload to GitHub's code scanning UI.
          generateSarif: true
      - name: Upload SARIF to GitHub
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: semgrep.sarif

  secrets-scan:
    name: Secrets scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so gitleaks can find old leaked secrets.
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Scan repo (all history)
        run: |
          gitleaks detect \
            --source . \
            --report-format=json \
            --report-path=gitleaks-report.json \
            --redact \
            --verbose
      - name: Upload report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          retention-days: 30
