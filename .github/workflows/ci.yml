# CHISMOSO V1.0 — Continuous Integration
#
# Runs on every push and pull_request. Verifies:
#   - The chismoso/ subproject compiles (`tsc --noEmit`) and its unit
#     test suite passes (410 tests; e2e.test.ts is excluded because it
#     makes real network calls that require provider API keys).
#   - The dashboard (Next.js) parent project compiles and its security
#     suite passes.
#
# Matrix: Node.js 20 LTS and 22 LTS — the two versions the README
# officially supports. Node 24 also works in practice but is not yet LTS.
#
# NOTE: the dashboard's `tsc --noEmit` step requires the chismoso/ subproject
# to be compiled to dist/ first (the dashboard API routes import from
# `chismoso/dist/*`). The prebuild step (`cd chismoso && npx tsc`) is run
# before the dashboard type-check so the dist/ tree exists. Pre-existing
# dashboard-only type errors in test files (delete-on-readonly, NODE_ENV
# assignment) are tracked separately and do NOT block this workflow because
# vitest uses esbuild (which is more permissive than tsc strict).
name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

# Cancel any in-flight run for the same ref when a new commit lands.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: |
            chismoso/package-lock.json
            package-lock.json

      # ---------------------------------------------------------------------
      # chismoso/ subproject — the intelligence motor (TypeScript / Vitest).
      # Uses npm (not bun) so the CI matches the documented Windows install
      # path. --no-audit --no-fund keeps the install focused on deps.
      # ---------------------------------------------------------------------
      - name: Install chismoso deps
        run: cd chismoso && npm install --no-audit --no-fund

      - name: Type-check chismoso
        run: cd chismoso && npx tsc --noEmit

      - name: Run chismoso unit tests (excludes E2E)
        run: cd chismoso && npx vitest run --exclude tests/e2e.test.ts

      # ---------------------------------------------------------------------
      # Dashboard (Next.js 16) parent project — uses the root package-lock.
      # The security suite is the only dashboard test that does NOT depend
      # on a running Next.js server (it mocks the route handlers).
      # ---------------------------------------------------------------------
      - name: Install dashboard deps
        run: npm install --no-audit --no-fund

      - name: Type-check dashboard
        run: npx tsc --noEmit

      - name: Run dashboard security tests
        run: npx vitest run tests/security.test.ts
