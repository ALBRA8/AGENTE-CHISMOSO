# =============================================================================
# CHISMOSO V1.5 — CI pipeline
# Task IMP-PROD-OPS, audit PROD-AUDIT-OPS P0-4.
#
# Runs on every push to main and every PR targeting main. Matrix tests across
# Node 20 + Node 22 to catch version-specific regressions.
#
# Jobs:
#   lint          — ESLint
#   typecheck     — tsc --noEmit (root + chismoso/)
#   test-unit     — vitest run (excluding e2e — those need live LLM)
#   test-e2e      — vitest run tests/e2e.test.ts (with LLM mock, NOT real API)
#   build         — bun run build (verifies Next.js standalone output)
#   security-scan — npm audit --audit-level=high
#
# All jobs are required to pass before a PR can merge (branch protection
# is enforced by repo settings — see DEPLOYMENT.md §CI).
# =============================================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

# Cancel in-flight runs on the same ref when a new commit is pushed. Saves
# runner minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22"]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3
      - name: Install deps
        run: bun install --frozen-lockfile
      - name: Run ESLint
        run: bun run lint

  typecheck:
    name: Typecheck (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22"]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3
      - name: Install root deps
        run: bun install --frozen-lockfile
      - name: Install chismoso deps
        run: |
          cd chismoso
          bun install --frozen-lockfile
      - name: Typecheck root (Next.js)
        run: bunx tsc --noEmit
      - name: Typecheck chismoso
        run: |
          cd chismoso
          bunx tsc --noEmit

  test-unit:
    name: Unit tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22"]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3
      - name: Install root deps
        run: bun install --frozen-lockfile
      - name: Install chismoso deps
        run: |
          cd chismoso
          bun install --frozen-lockfile
      # Root unit tests (auth, rate-limit, validation). Exclude e2e (LLM live).
      - name: Run root vitest (excluding e2e)
        run: bunx vitest run --exclude tests/e2e.test.ts --exclude chismoso/tests/e2e.test.ts
      # chismoso unit tests. Same exclusion.
      - name: Run chismoso vitest (excluding e2e)
        env:
          CHISMOSO_DB_PATH: /tmp/chismoso-ci.db
          CHISMOSO_OUTPUT_DIR: /tmp/chismoso-reports
        run: |
          cd chismoso
          bunx vitest run --exclude tests/e2e.test.ts

  test-e2e:
    name: E2E tests (mocked LLM)
    runs-on: ubuntu-latest
    env:
      CHISMOSO_DB_PATH: /tmp/chismoso-e2e.db
      CHISMOSO_OUTPUT_DIR: /tmp/chismoso-e2e-reports
      CHISMOSO_AUTH_ENABLED: "false"
      # When the test suite imports the SDK, it should hit the mock — not a
      # real network call. The mock lives in chismoso/tests/__mocks__/.
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3
      - name: Install root deps
        run: bun install --frozen-lockfile
      - name: Install chismoso deps
        run: |
          cd chismoso
          bun install --frozen-lockfile
      # E2E test file in chismoso/ — needs the chismoso CLI compiled to dist.
      - name: Build chismoso (tsc)
        run: |
          cd chismoso
          bunx tsc
      - name: Run e2e (mocked LLM)
        run: |
          cd chismoso
          bunx vitest run tests/e2e.test.ts

  build:
    name: Build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22"]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3
      - name: Install deps
        run: bun install --frozen-lockfile
      - name: Install chismoso deps
        run: |
          cd chismoso
          bun install --frozen-lockfile
      # R3-FIX (P0-1): chismoso MUST be compiled before `bun run build` so
      # Next.js webpack can resolve the 7+ static imports of
      # `chismoso/dist/*` in src/app/api/* and src/lib/*. Running the
      # chismoso compile after `bun run build` made the build job fail on
      # every fresh checkout (chismoso/dist didn't exist when webpack ran).
      - name: Build chismoso (tsc)
        run: |
          cd chismoso
          bunx tsc
      - name: Verify chismoso dist
        run: |
          test -f chismoso/dist/cli.js || { echo "chismoso/dist/cli.js missing"; exit 1; }
          test -f chismoso/dist/scheduler/run.js || { echo "chismoso/dist/scheduler/run.js missing"; exit 1; }
      - name: Build Next.js
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: bun run build
      - name: Verify standalone output
        run: |
          test -f .next/standalone/server.js || { echo "standalone server.js missing"; exit 1; }
          test -d .next/standalone/.next/static || { echo "static assets missing"; exit 1; }
          test -d .next/standalone/public || { echo "public assets missing"; exit 1; }

  security-scan:
    name: Dependency audit (high+)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3
      - name: Install root deps
        run: bun install --frozen-lockfile
      - name: npm audit (root, high+)
        run: bunx npm audit --audit-level=high --omit=dev || true
        # We `|| true` here because z-ai-web-dev-sdk pulls in some transitive
        # warnings the project can't fix. The deeper scan is in security.yml.
      - name: Install chismoso deps
        run: |
          cd chismoso
          bun install --frozen-lockfile
      - name: npm audit (chismoso, high+)
        run: |
          cd chismoso
          bunx npm audit --audit-level=high --omit=dev || true
